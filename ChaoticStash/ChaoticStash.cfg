# Chaotic's Stash - configuration
# Plain key=value. Lines starting with # are ignored.
# Edit, then restart the game (or the server) for changes to take effect.

# Master switch.
Enabled=true

# The key that stashes. Any UnityEngine.KeyCode name, e.g.
#   V  B  N  H  K  Backslash  LeftBracket  F5  Keypad0
# The key is ignored while you are typing in chat, a search box or the console.
Key=V

# How far a container may be, in blocks, and still count. 1-100.
Radius=25

# Also empty the toolbelt. The item currently in your hands is never touched.
IncludeToolbelt=false

# Guns, tools, armour and anything else that carries a quality level.
# Off by default: a chest holding one pistol should not swallow the good one
# you are carrying.
IncludeQualityItems=false

# Honour the slot padlocks you set in the backpack UI.
RespectLockedSlots=true

# After topping up matching stacks, allow a fresh slot in a container that
# already holds the item. Turn off to only ever top up existing stacks.
CreateNewStacks=true

# Only containers a player placed. Off would include un-looted world loot
# crates, which is almost never what you want.
OnlyPlayerStorage=true

# Require the container to sit inside your own land claim.
RequireLandClaim=false

# Stash on a timer as well as on the key. Off by default.
AutoStash=false
AutoStashInterval=5

# On-screen confirmation of what moved.
ShowMessage=true

# Item names that never leave you, whatever a chest holds. Comma separated,
# internal item names as used in items.xml, e.g.:
# IgnoreItems=drinkJarBoiledWater,foodCanChili,firstAidBandage
IgnoreItems=

# Log the container count each scan.
Debug=false