# Chaotic's Beastmaster
# Edit and restart the server. Anything missing or unparseable falls back to the default.

Enabled=true

# ---- Taming -------------------------------------------------------------------
# Finished meals before an animal turns. A meal only counts when the animal actually
# eats the bait through to the end - walking over and sniffing it does nothing.
FeedsToTame=5

# How many meals one Chaotic's Prime Bait is worth. This is the sane way to tame a
# bear: 3 Prime baits instead of 5 trips to a grizzly's face.
PrimeBaitFeedValue=2

# How many companions one player may OWN (the kennel). Only ever ONE is out at a time -
# the rest wait until called with /pet call <n>. 0 disables taming entirely and leaves
# the bait working purely as an escape tool.
MaxOwnedPets=5

# How many animals a single thrown bait can occupy. 1 = a wolf pack does NOT all pile onto
# one slab: the closest animal takes it and the rest keep coming for you. 0 = vanilla decoy
# behaviour, every eligible animal in radius is pulled at once.
MaxAnimalsPerBait=1

# ---- Escaping -----------------------------------------------------------------
# Whether bait can break a chase that is already under way. Off means bait only works
# on animals that have not noticed you yet, which is much less useful.
BreakActiveAggro=true

# Seconds a baited animal is barred from re-targeting a player. Only has to cover the
# moment between dropping the target and the animal committing to the food; after that
# the game suppresses re-targeting by itself. Raise it for a longer guaranteed escape.
PacifySeconds=8

# ---- Companions ---------------------------------------------------------------
# Metres the companion allows before it starts closing on you.
FollowDistance=6

# Metres past which it stops pathing and teleports to you. Without this a pet loses you
# the first time you take a vehicle.
TeleportDistance=45

# Companion max health multiplier, applied once at taming. 1 = same as the wild animal.
PetHealthScale=1.5

# Let companions attack players. Off means a pet never fights a person - including its
# own owner, whatever the owner does to it. Turn on only for PvP servers.
PetsAttackPlayers=false

# ---- Which animals ------------------------------------------------------------
# The built-in list is wolf, coyote, mountain lion, bear and small bear (tameable), plus
# dire wolf, zombie bear, zombie dog and zombie boar (bait works, but they never follow
# you home). The mod puts those tags on in code, so no other mod can knock them off.
#
# To include more, list their entity class names here, comma separated. Tameable means
# bait works AND five meals makes it yours; Baitable means bait works and nothing else.
ExtraTameable=
ExtraBaitable=

# ---- Feedback -----------------------------------------------------------------
# Tooltip after each meal telling the feeder how the taming is going.
NotifyProgress=true

# Verbose server log: task injection, aggro breaks, feed counts, respawns.
Debug=false
