# Chaotic's Zombie Companion
#
# key=value, one per line. # or ; starts a comment. Anything missing falls back to the default
# shown here. Reload needs a server restart.

Enabled=true

# ------------------------------------------------------------------ turning a zombie
# Finished meals a plain walker needs before it takes the leash. Ripe Gore Bait counts as
# RipeBaitFeedValue meals, so at the defaults two ripe piles turn a walker.
FeedsToThrall=4
RipeBaitFeedValue=2

# Extra meals on top of FeedsToThrall for the harder tiers. A radiated zombie carries the feral tag
# as well and a charged one carries both, so only the highest bonus ever applies - never the sum.
FeralFeedBonus=2
RadiatedFeedBonus=4
ChargedFeedBonus=6

# How many zombies one thrown pile may occupy.
#   1 = the closest one takes it and the rest of the horde keeps coming (default, and the reason
#       the item is an escape tool rather than a horde-off button).
#   0 = unlimited, i.e. vanilla decoy behaviour.
MaxZombiesPerBait=1

# Whether bait breaks a chase that is already under way. Off makes the item nearly pointless -
# vanilla refuses to consider a distraction while the zombie holds a target.
BreakActiveAggro=true

# Seconds a baited zombie may not re-target a player, covering the gap between the mod clearing
# its target and the game's own distraction AI taking over.
PacifySeconds=8

# ------------------------------------------------------------------ the roster
# How many thralls one player may hold in total, and how many of those may stand in the world at
# the same time. The rest wait until called with /thrall call <n>.
MaxOwnedThralls=6
MaxActiveThralls=2

# Real minutes before the gore wears off and a thrall wanders away for good. 0 = never.
# Feeding a thrall another pile of gore resets its clock, so a server that turns this on makes
# thralls a consumable with a running cost rather than a pet.
DecayMinutes=0

# ------------------------------------------------------------------ behaviour
# Metres of slack before a thrall starts closing on its owner, and the distance past which it stops
# trying to path and simply catches up (a thrall left behind by a vehicle is a thrall you lose).
FollowDistance=5
TeleportDistance=45

# Thrall max health multiplier. 1 = whatever that zombie tier already had, which is already a lot
# for a radiated one.
ThrallHealthScale=1.0

# Let thralls target players. Off means a thrall never fights a person, ever - including in PvP,
# including the owner who just shot it by mistake.
ThrallsAttackPlayers=false

# Master switch for zombie-versus-zombie. Vanilla will not do this on its own at all: a zombie's
# chase list has no zombie in it, and the "this hurt me" revenge channel is hard-blocked between
# things of the same EntityType. Turning this OFF makes thralls much STRONGER, not weaker - nothing
# in the game will ever fight one.
ThrallsDrawAggro=true

# Metres around a thrall within which the horde comes for IT instead of for you.
# 0 leaves only retaliation - they fight back when hit, but walk straight past to reach you.
ThrallTauntRadius=14

# Fraction of the zombies in that radius that switch to the thrall. Rolled ONCE per zombie, so this
# is a stable split of the horde rather than a per-second coin flip that would pull everything
# within a few seconds.
#   1.0 = the whole horde forgets you exist. Trivialises blood moons.
#   0.5 = a wall you can fight behind, not hide behind.  (default)
#   0.0 = retaliation only.
ThrallTauntShare=0.5

# Seconds a taunted zombie is held off the player, refreshed every second while it is still near
# the thrall. In practice this is "how long aggro survives your thrall dying".
TauntSeconds=8

# Whether a thrall keeps the block-breaking AI it had as a zombie. Off for the obvious reason:
# it follows you home.
ThrallsBreakBlocks=false

# Tell the player how a conversion is going after every meal.
NotifyProgress=true

# ------------------------------------------------------------------ which zombies
# By default every entity class named zombie* can be turned, except the templates and the two below.
# Both are matched as substrings, so "zombieScreamer" also covers its feral/radiated/charged tiers.
#   zombieDemolition - detonates, and it would follow you home first.
#   zombieScreamer   - its scream calls a horde onto its own position, i.e. onto you.
# Set it to nothing (ExcludeZombies=) if you want the carnage.
ExcludeZombies=zombieDemolition,zombieScreamer

# Comma-separated entity class names to force in, for modded zombies that do not follow the
# vanilla zombie* naming. e.g. ExtraThrallable=myModWalker,myModCrawler
ExtraThrallable=

# Verbose per-decision logging. Also switchable live with the console command: zc trace on
Debug=false
