# Chaotic's Reach - settings
#
# Edit, then restart the game. Values are read once at load.

# Turn the whole thing off without uninstalling.
Enabled=true

# How far a container can be and still count, in blocks. Clamped to 1-100.
# 20 covers a normal base room. Large numbers cost more CPU while the
# crafting window is open.
Radius=20

# Prints what it pulls, and how many containers it found, to the log.
Debug=false