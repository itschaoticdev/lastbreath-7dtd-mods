# Chicken Scoop - configuration
# Lines starting with # or ; are ignored. Restart the server to apply changes.

# Master switch. false = no Harmony patches applied at all.
Enabled = true

# Require the vanilla Vehicle Plow Mod on the vehicle.
# The plow is the scoop: installing it enables the truck prefab's "M/Plow" transform,
# so an actual blade appears on the front bumper. Set false to let any vehicle scoop.
RequirePlowMod = true

# Vehicle mod tag that counts as a scoop. "plow" = vanilla modVehiclePlow.
ScoopModTag = plow

# Entity tags scanned for scoopable animals. Comma separated.
# Anything matched is only scooped if its entity class has a PickupItem property,
# so this stays safe if you widen it (e.g. to "animal").
TargetEntityTags = chicken

# Scan box placed ahead of the vehicle centre, in metres.
ScanForwardOffset = 1.6
ScanRadius = 2.2

# Vehicle must be moving at least this fast, in metres/second.
MinSpeed = 2.0

# Seconds between scans per vehicle. Lower = catches birds at higher speed, costs more CPU.
ScanInterval = 0.15

# Max birds taken per scan, so driving through a flock does not empty it instantly.
MaxPerScan = 2

# Feedback
PlaySound = true
NotifyDriver = true

# Log why a moving vehicle did or did not scoop (speed, storage slots, candidates found).
# Useful once, when something is not working. Leave off for normal play.
Debug = false
