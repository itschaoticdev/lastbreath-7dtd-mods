# Chaotic's Pickup - configuration
# Plain key=value. Lines starting with # are ignored.
# Edit, then restart the game (or the server) for changes to take effect.

# Master switch.
Enabled=true

# Take a workstation or container that still has things inside it. The contents
# are handed to you (or dropped at your feet if you are full), never deleted.
# Off means vanilla's "Empty it first".
AllowNonEmpty=false

# Let un-looted world loot crates be pocketed. Leave this OFF - picking one up
# and re-placing it rolls fresh loot, which is an item printer.
AllowWorldLootContainers=false

# Blocks where the developers set TakeDelay to -1 have pickup switched off on
# purpose (quest and POI-critical blocks). true honours that.
RespectDisabledTakeDelay=true

# Turn on the Take option for multi-block decor - beds, couches, big appliances.
# Taking one cell takes the whole thing: the mod resolves to the parent block
# and the game removes the rest. Set false if a POI ever leaves a stray half.
AllowMultiBlock=true

# ---------------------------------------------------------------------------
# What becomes pickable
#
# A block qualifies if its class is in PickupClasses, OR its FilterTags contain
# one of AllowFilterTags. Anything in DenyFilterTags, or whose name contains a
# DenyNameContains entry, or that is listed in DenyBlocks, is refused first.
# AllowBlocks overrides every rule.
#
# Workstations, generator/battery/solar banks, turrets, spotlights, switches,
# pressure plates, tripwires, timer relays, dew collectors, apiaries and chicken
# coops are handled separately and are always covered - they already have a Take
# option, it was just locked to your own land claim.
# ---------------------------------------------------------------------------

# Extra block classes to make pickable. Matches the whole class chain.
PickupClasses=BlockLight,BlockLadder,BlockSleepingBag,BlockCampfire

# FilterTags from blocks.xml that qualify a block.
AllowFilterTags=SC_decor,SC_electrical,SC_lighting,SC_plumbing,SC_commercial,SC_residential,SC_industrial,SC_automotive,SC_traps,SC_signs,MC_playerBlocks,SC_playerHelpers

# FilterTags that disqualify it, whatever else matches. Every SC_helper* tag is
# always denied as well.
DenyFilterTags=MC_building,MC_Shapes,MC_helpers,SC_terrain,SC_trees,SC_shrubbery,SC_crops,SC_questblocks,SC_treasureRoom,SC_destruction,SC_helperSleeper

# Substring match on the internal block name, lower-cased.
DenyNameContains=vending,trader,questBlock,supplyCrate,airdrop

# Exact internal block names. AllowBlocks wins over everything above.
# keystoneBlock is the land claim - the game already handles that one itself.
AllowBlocks=
DenyBlocks=keystoneBlock

# Log every block the mod makes pickable. Very noisy - one line per block.
Debug=false
